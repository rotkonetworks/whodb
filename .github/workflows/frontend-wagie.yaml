name: Frontend Assistant
on:
 issue_comment:
   types: [created]
 pull_request_review_comment:
   types: [created]
 issues:
   types: [opened, assigned]
 pull_request_review:
   types: [submitted]
 pull_request:
   types: [opened, synchronize]
jobs:
 check-membership:
   runs-on: ubuntu-latest
   outputs:
     is-member: ${{ steps.membership.outputs.is-member }}
   steps:
     - name: check org membership
       id: membership
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         # get actor (comment author or pr author)
         if [[ "${{ github.event_name }}" == "issue_comment" || "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
           actor="${{ github.event.comment.user.login }}"
         elif [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
           actor="${{ github.event.review.user.login }}"
         else
           actor="${{ github.actor }}"
         fi
         
         # check membership (returns 204 if member, 404 if not)
         status=$(curl -s -o /dev/null -w "%{http_code}" \
           -H "Authorization: token $GITHUB_TOKEN" \
           "https://api.github.com/orgs/${{ github.repository_owner }}/members/$actor")
         
         if [[ "$status" == "204" ]]; then
           echo "is-member=true" >> $GITHUB_OUTPUT
         else
           echo "is-member=false" >> $GITHUB_OUTPUT
         fi

 claude-response:
   needs: check-membership
   if: needs.check-membership.outputs.is-member == 'true'
   runs-on: ubuntu-latest
   permissions:
    id-token: write
    contents: write
    issues: write
    pull-requests: write
   steps:
     - uses: actions/checkout@v4
       with:
         fetch-depth: -1
     - uses: anthropics/claude-code-action@beta
       with:
         anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
         trigger_phrase: "/frontend"
         timeout_minutes: 30
         allowed_tools: "Bash(npm run build),Bash(npm run dev),Bash(npm test),Bash(npm run lint),Bash(npm run type-check),Bash(bun build),Bash(bun test),Bash(bun run dev),Bash(tsc),Bash(eslint),Bash(prettier),Bash(git log),Bash(git diff),Bash(git show),Bash(find),Bash(grep),Bash(ls),Bash(cat),Bash(head),Bash(tail),Bash(awk),Bash(jq),Bash(sed),Bash(wc),Bash(sort),Bash(uniq),Bash(cut),Bash(xargs)"
         custom_instructions: |
            you are a frontend specialist working with react/unocss codebase.
            focus on performance, accessibility, and clean component architecture.
            
            review pattern:
            component: [name and purpose]
            issue: [what's wrong]
            impact: [user/dev experience]
            fix: |
                ```tsx
                // clean, performant solution
                export function Component() {
                  return <div className="uno-class" />
                }
                ```
            
            priorities:
            - unocss atomic classes over custom css
            - typescript strict mode compliance  
            - accessibility (aria, semantic html)
            - performance (memo, lazy loading, bundle size)
            - component composition over inheritance
            - error boundaries and loading states
