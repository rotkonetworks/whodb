name: Security Assistant
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]
jobs:
  check-membership:
    runs-on: ubuntu-latest
    outputs:
      is-member: ${{ steps.membership.outputs.is-member }}
    steps:
      - name: check org membership
        id: membership
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # get actor (comment author or pr author)
          if [[ "${{ github.event_name }}" == "issue_comment" || "${{ github.event_name }}" == "pull_request_review_comment" ]]; then
            actor="${{ github.event.comment.user.login }}"
          elif [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            actor="${{ github.event.review.user.login }}"
          else
            actor="${{ github.actor }}"
          fi

          echo "checking membership for: $actor"
          
          # check if repo owner (bypass membership check)
          repo_owner="${{ github.repository_owner }}"
          if [[ "$actor" == "$repo_owner" ]]; then
            echo "actor is repo owner, bypassing membership check"
            echo "is-member=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # check membership (returns 204 if member, 404 if not, 302 for insufficient permissions)
          response=$(curl -s -I \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/orgs/$repo_owner/members/$actor")
          
          status=$(echo "$response" | grep -E "^HTTP" | tail -1 | awk '{print $2}')
          
          echo "membership check status: $status"
          
          if [[ "$status" == "204" || "$status" == "302" ]]; then
            # 204 = member confirmed, 302 = redirect (usually means we need to check public membership)
            echo "is-member=true" >> $GITHUB_OUTPUT
          else
            # fallback: check public membership
            public_status=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.github.com/orgs/$repo_owner/public_members/$actor")
            
            if [[ "$public_status" == "204" ]]; then
              echo "is-member=true" >> $GITHUB_OUTPUT
            else
              echo "is-member=false" >> $GITHUB_OUTPUT
            fi
          fi

  claude-response:
    needs: check-membership
    if: needs.check-membership.outputs.is-member == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: -1
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "/security"
          timeout_minutes: 30
          allowed_tools: "Bash(cargo check),Bash(cargo clippy),Bash(cargo test),Bash(npm run build),Bash(npm test),Bash(bun test),Bash(tsc),Bash(git log),Bash(git diff),Bash(git show),Bash(find),Bash(grep),Bash(ls),Bash(cat),Bash(head),Bash(tail),Bash(awk),Bash(jq),Bash(sed),Bash(wc),Bash(sort),Bash(uniq),Bash(cut),Bash(xargs)"
          custom_instructions: |
            you are an anarchist security researcher working on critical infrastructure for humanity.
            think and review like Daniel Micay providing constructive structured feedback.

            issue: [what breaks]
            line: [file:line]
            attack: [how exploitable]
            example fix: |
                ```rust
                fn example() {
                  // example code with insightful comments only
                }
                ```
