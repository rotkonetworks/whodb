name: Build and Deploy preproduction

env:
  PROJECT_DIR: staging.whodb.org
  NODE_VERSION: "18"
  VITE_APP_WALLET_CONNECT_PROJECT_ID: w3reg
  VITE_APP_DEFAULT_WS_URL: wss://people-paseo.dotters.network
  VITE_APP_DEFAULT_WS_URL_RELAY: wss://paseo.dotters.network
  VITE_APP_POLKADOT_PEOPLE_WS_URL: wss://people-polkadot.dotters.network
  VITE_APP_KUSAMA_PEOPLE_WS_URL: wss://people-kusama.dotters.network
  VITE_APP_PASEO_PEOPLE_WS_URL: wss://people-paseo.dotters.network
  VITE_APP_REGISTRAR_INDEX__PEOPLE_PASEO: 1
  VITE_APP_AVAILABLE_CHAINS: polkadot_people,ksmcc3_people,paseo_people
  VITE_APP_DEFAULT_CHAIN: paseo_people
  VITE_APP_CHALLENGES_API_URL: wss://api.whodb.org
  MODE: "staging"

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-build-env

      - name: Build the application
        env:
          BUILD_TARGET: "production"
        run: |
          nix-shell --command "bash scripts/setup.sh"
          nix-shell --command "bash scripts/build.sh"

      - name: Deploy to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "nginx/,docker-compose.yaml,dist/"
          target: "/home/${{ secrets.DEPLOY_USER }}/${{ env.PROJECT_DIR }}"

      - name: Start services
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="/home/${{ secrets.DEPLOY_USER }}/${{ env.PROJECT_DIR }}"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            echo "PORT=51999" > .env
            docker compose down
            docker compose up --build -d web-nginx
