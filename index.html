<!DOCTYPE html>
<html lang="en" class="dark-theme">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Search and verify blockchain identities across multiple networks. Find people by name, wallet address, or social handles." />
  <meta name="keywords"
    content="blockchain identity, decentralized identity, identity verification, web3 identity, blockchain search" />
  <meta name="theme-color" content="#111827" />

  <title>whodb - Identities, Verified</title>

  <link rel="preload" href="/whodb_icon_compact.svg" as="image" type="image/svg+xml" fetchpriority="high" />
  <link rel="icon" href="/whodb_icon_compact.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="whodb - Identities, Verified" />
  <meta property="og:description" content="Search and verify blockchain identities across multiple networks" />

  <style>
    /* Tailwind/UnoCSS reset - must match @unocss/reset/tailwind.css */
    *, *::before, *::after { box-sizing: border-box; border-width: 0; border-style: solid; }
    html { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; line-height: inherit; }
    blockquote, dl, dd, h1, h2, h3, h4, h5, h6, hr, figure, p, pre, fieldset, legend { margin: 0; padding: 0; }
    form { margin: 0; }
    h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
    ol, ul, menu { list-style: none; margin: 0; padding: 0; }
    a { color: inherit; text-decoration: inherit; }
    b, strong { font-weight: bolder; }
    code, kbd, samp, pre { font-family: ui-monospace, monospace; font-size: 1em; }
    small { font-size: 80%; }
    button, input, optgroup, select, textarea { font-family: inherit; font-size: 100%; font-weight: inherit; line-height: inherit; color: inherit; margin: 0; padding: 0; }
    button, select { text-transform: none; }
    button, [type='button'], [type='reset'], [type='submit'] { -webkit-appearance: button; background-color: transparent; background-image: none; }
    :-moz-focusring { outline: auto; }
    img, svg, video, canvas, audio, iframe, embed, object { display: block; vertical-align: middle; }
    img, video { max-width: 100%; height: auto; }
    [hidden] { display: none; }

    /* App styles */
    :root {
      --primary: 343 89% 58%;
      --primary-foreground: 210 40% 98%;
    }
    html { background-color: #111827; }
    body { background-color: #111827; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* Shell positioning - absolute overlay that hides when React renders */
    #root, #shell {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      min-height: 100vh;
    }

    /* Shell on top initially */
    #shell {
      z-index: 1;
    }

    /* Matches App wrapper: div.bg-gray-900.text-white.antialiased */
    .s-app {
      background-color: #111827;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Matches HomePage: div.min-h-screen.bg-gray-900.flex.flex-col */
    .s-page {
      min-height: 100vh;
      background-color: #111827;
      display: flex;
      flex-direction: column;
    }

    /* Hide shell when React renders */
    #root:not(:empty) ~ #shell { display: none !important; }
    #shell.hidden { display: none !important; }

    /* Main - matches flex-1 flex flex-col items-center justify-center px-4 */
    /* flex-1 in Tailwind/UnoCSS is "flex: 1 1 0%" not just "flex: 1" */
    .s-main { flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 1rem; }

    /* Content wrapper - matches w-full max-w-md mx-auto flex flex-col items-center */
    .s-content { width: 100%; max-width: 28rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }

    /* Logo wrapper - matches mb-8 md:mb-10 */
    .s-logo-wrap { margin-bottom: 2rem; }
    @media(min-width:768px) { .s-logo-wrap { margin-bottom: 2.5rem; } }

    /* Logo container - matches flex items-center */
    .s-logo { display: flex; align-items: center; }

    /* Logo icon - matches w-auto h-8 sm:h-10 md:h-12 lg:h-14 mr-2 sm:mr-2 md:mr-3 */
    .s-logo img {
      height: 2rem;
      width: auto;
      margin-right: 0.5rem;
    }
    @media(min-width:640px) { .s-logo img { height: 2.5rem; } }
    @media(min-width:768px) { .s-logo img { height: 3rem; margin-right: 0.75rem; } }
    @media(min-width:1024px) { .s-logo img { height: 3.5rem; } }

    /* Logo text - matches text-3xl sm:text-4xl md:text-5xl lg:text-6xl + module CSS */
    .s-logo-text {
      font-family: Arial, sans-serif;
      font-weight: bold;
      letter-spacing: -0.02em;
      color: #fff;
      font-size: 1.875rem;
      line-height: 2.25rem;
    }
    @media(min-width:640px) { .s-logo-text { font-size: 2.25rem; line-height: 2.5rem; } }
    @media(min-width:768px) { .s-logo-text { font-size: 3rem; line-height: 1; } }
    @media(min-width:1024px) { .s-logo-text { font-size: 3.75rem; line-height: 1; } }

    /* Form wrapper - matches w-full relative from SearchForm component */
    .s-form-wrap { width: 100%; position: relative; }

    /* Form - matches w-full */
    .s-form { width: 100%; position: relative; }

    /* Input - matches h-10 md:h-12 pl-10 md:pl-12 pr-10 rounded-full bg-gray-800 border border-gray-700 */
    .s-input {
      width: 100%;
      height: 2.5rem;
      padding: 0 2.5rem 0 2.5rem;
      border-radius: 9999px;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      font-size: 0.875rem;
      line-height: 1.25rem;
      outline: none;
      box-sizing: border-box;
      font-family: Inter, system-ui, sans-serif;
      transition: all 150ms;
    }
    .s-input::placeholder { color: #9ca3af; }
    .s-input:focus { border-color: #ec4899; box-shadow: 0 0 0 2px rgba(236,72,153,0.2); }
    @media(min-width:768px) { .s-input { height: 3rem; padding: 0 2.5rem 0 3rem; font-size: 1rem; line-height: 1.5rem; } }

    /* Search icon - matches absolute left-3 md:left-4 top-1/2 -translate-y-1/2 w-4 h-4 md:w-5 md:h-5 text-gray-400 */
    .s-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1rem;
      height: 1rem;
      color: #9ca3af;
      pointer-events: none;
    }
    @media(min-width:768px) { .s-icon { left: 1rem; width: 1.25rem; height: 1.25rem; } }

    /* Submit button - absolute right, appears only when input has text */
    .s-submit {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      padding: 0;
      display: none;
      transition: color 150ms;
    }
    .s-submit:hover { color: #fff; }
    .s-submit svg { width: 1rem; height: 1rem; }
    .s-submit.visible { display: block; }

    /* Loading spinner */
    .s-loader {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #6b7280;
      font-size: 0.75rem;
    }
    .s-spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid #374151;
      border-top-color: #ec4899;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      opacity: 0.6;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="root"></div>

  <div id="shell">
    <div class="s-app">
    <div class="s-page">
    <main class="s-main">
      <div class="s-content">
        <div class="s-logo-wrap">
          <div class="s-logo">
            <img src="/whodb_icon_compact.svg" alt="" />
            <span class="s-logo-text">whodb</span>
          </div>
        </div>
        <div class="s-form-wrap">
          <form class="s-form" id="sf" autocomplete="off">
          <div style="position:relative">
          <input class="s-input" id="si" type="text" placeholder="Search identities..." />
          <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <button type="submit" class="s-submit" id="sb" aria-label="Submit search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
            </svg>
          </button>
          </div>
          </form>
        </div>
        <div class="s-loader" id="sl">
          <div class="s-spinner"></div>
        </div>
      </div>
    </main>
    </div>
    </div>
  </div>

  <script>
    (function() {
      var shell = document.getElementById('shell');
      // Hide on non-homepage
      if (location.pathname !== '/' && location.pathname !== '') {
        shell.style.display = 'none';
        return;
      }
      var input = document.getElementById('si');
      var btn = document.getElementById('sb');
      var form = document.getElementById('sf');
      // Restore search query from sessionStorage
      var saved = sessionStorage.getItem('whodb_search');
      if (saved) {
        input.value = saved;
        btn.classList.toggle('visible', !!saved.trim());
      }
      input.oninput = function() {
        var q = input.value.trim();
        btn.classList.toggle('visible', !!q);
        sessionStorage.setItem('whodb_search', input.value);
      };
      form.onsubmit = function(e) {
        e.preventDefault();
        var q = input.value.trim();
        if (q) location.href = '/search?query=' + encodeURIComponent(q);
      };
      window.__shellHide = function() { shell.classList.add('hidden'); };
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
